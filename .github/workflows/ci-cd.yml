name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run project checks
        run: npm run check

  publish-image:
    name: Publish Lambda image
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      IMAGE_TAG: ${{ github.sha }}-${{ github.run_attempt }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail

          test -n "${AWS_REGION}" ||
            { echo "AWS_REGION is not configured."; exit 1; }

          test -n "${AWS_ROLE_ARN}" ||
            { echo "AWS_ROLE_ARN is not configured."; exit 1; }

          test -n "${ECR_REPOSITORY}" ||
            { echo "ECR_REPOSITORY is not configured."; exit 1; }

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push ARM64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: false
          tags: >-
            ${{ steps.login-ecr.outputs.registry }}/${{
            env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

      - name: Update Lambda
        if: vars.LAMBDA_FUNCTION_NAME != ''
        env:
          LAMBDA_FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION_NAME }}
          IMAGE_URI: >-
            ${{ steps.login-ecr.outputs.registry }}/${{
            env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
        shell: bash
        run: |
          set -euo pipefail

          aws lambda update-function-code \
            --function-name "${LAMBDA_FUNCTION_NAME}" \
            --image-uri "${IMAGE_URI}" \
            --region "${AWS_REGION}" \
            --output json > /dev/null

          aws lambda wait function-updated \
            --function-name "${LAMBDA_FUNCTION_NAME}" \
            --region "${AWS_REGION}"

          echo "Lambda updated with ${IMAGE_URI}"

      - name: Verify CloudFront
        if: vars.CLOUDFRONT_URL != ''
        env:
          CLOUDFRONT_URL: ${{ vars.CLOUDFRONT_URL }}
        shell: bash
        run: |
          set -euo pipefail

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            --output /dev/null \
            "${CLOUDFRONT_URL%/}/"

          echo "CloudFront smoke test passed."